{% include 'admin/cabecera.html' %}

<div class="container">
    <br/>
    <div class="row">
        <!-- FORMULARIO PARA AGREGAR LIBRO (Izquierda) -->
        <div class="col-md-5">
            <div class="card">
                <div class="card-header">Datos del libro</div>
                <div class="card-body">
                    <form action="/admin/libros/guardar" method="post" enctype="multipart/form-data">
                        
                        <div class="mb-3">
                            <label for="txtNombre" class="form-label">Nombre del libro</label>
                            <input type="text" class="form-control" name="txtNombre" id="txtNombre" placeholder="Escribe el nombre del libro">
                        </div>

                        <div class="mb-3">
                            <label for="txtImagen" class="form-label">Imagen</label>
                            <input type="file" class="form-control" name="txtImagen" id="txtImagen">
                        </div>

                        <div class="mb-3">
                            <label for="txtURL" class="form-label">URL Descarga:</label>
                            <input type="text" class="form-control" name="txtURL" id="txtURL" placeholder="Escribe la URL de descarga">
                        </div>

                        <button type="submit" class="btn btn-success">Agregar</button>

                    </form>
                </div>
                <div class="card-footer text-muted"></div>
            </div>
        </div>

        <!-- TABLA PARA MOSTRAR LOS LIBROS (Derecha) -->
        <div class="col-md-7">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Imagen</th>
                        <th>URL</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for libro in libros %}
                    <tr>
                        <!-- Columna 0: ID -->
                        <td>{{ libro[0] }}</td>
                        
                        <!-- Columna 1: Nombre -->
                        <td>{{ libro[1] }}</td>
                        
                        <!-- Columna 2: Imagen -->
                        <td>
                            <img width="60" src="{{ url_for('imagenes', imagen=libro[2]) }}" alt="Imagen del libro">
                        </td>
                        
                        <!-- Columna 3: URL (convertida en botón limpio para que no estire la tabla) -->
                        <td>
                            <a href="{{ libro[3] }}" target="_blank" class="btn btn-sm btn-success" role="button">Ver enlace</a>
                        </td>
                        
                        <!-- Columna 4: Acciones (Botón Eliminar) -->
                        <td>
                            <form action="/admin/libros/eliminar" method="post">
                                <input value="{{ libro[0] }}" type="hidden" name="txtID" id="txtID">
                                <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

    </div>
</div>

{% include 'admin/pie.html' %}
